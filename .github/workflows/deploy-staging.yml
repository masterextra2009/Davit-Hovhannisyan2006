name: Deploy Staging to Beget
on:
  push:
    branches: [staging]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          npm ci
          npm install @tailwindcss/oxide-linux-x64-gnu --no-save
      - name: Build
        run: npm run build
      - name: Swap in the password-protected .htaccess for staging
        run: |
          cp deploy/staging.htaccess dist/.htaccess
          cp deploy/.htpasswd dist/.htpasswd
      - name: Deploy via SFTP (password)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: mastesu6
          server: ${{ secrets.FTP_HOST }}
          port: 22
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: 'test.sever-18.ru/public_html'
          sftpArgs: '-o ConnectTimeout=30'
      - name: Deploy dotfiles via SFTP (password)
        # см. комментарий в deploy.yml — sftp-клиент своим glob'ом никогда не
        # находит файлы, начинающиеся с точки (.htaccess, .htpasswd)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: mastesu6
          server: ${{ secrets.FTP_HOST }}
          port: 22
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './dist/.htaccess'
          remote_path: 'test.sever-18.ru/public_html'
          sftpArgs: '-o ConnectTimeout=30'
      - name: Deploy .htpasswd via SFTP (password)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: mastesu6
          server: ${{ secrets.FTP_HOST }}
          port: 22
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './dist/.htpasswd'
          remote_path: 'test.sever-18.ru/public_html'
          sftpArgs: '-o ConnectTimeout=30'
