<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Печать и чернила">
  <defs>
    <clipPath id="liquidClip">
      <rect x="47" y="27" width="12" height="21" rx="2"/>
    </clipPath>
  </defs>

  <!-- Printer body -->
  <rect x="8" y="30" width="30" height="20" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/>
  <!-- Paper slot on top -->
  <rect x="14" y="25" width="18" height="7" rx="1.5" fill="none" stroke="#185FA5" stroke-width="1.6"/>
  <!-- Output paper -->
  <rect x="12" y="47" width="22" height="4" rx="1" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
  <!-- Control panel line -->
  <rect x="13" y="36" width="14" height="2.5" rx="1.2" fill="#378ADD" opacity="0.6"/>

  <!-- Status light: blinking = "printer is working" -->
  <circle cx="32" cy="41" r="2.4" fill="#0F6E56">
    <animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#1D9E75;#0F6E56;#1D9E75" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Connecting flow line: ink travels from jar to printer -->
  <path id="flowPath" d="M46 38 C 42 38, 40 36, 36 35" fill="none" stroke="#85B7EB" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 5">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <circle r="1.8" fill="#185FA5">
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M46 38 C 42 38, 40 36, 36 35"/>
    <animate attributeName="opacity" values="1;1;0" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Ink jar -->
  <rect x="45" y="23" width="16" height="27" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/>
  <rect x="49.5" y="18" width="7" height="6" rx="1.2" fill="none" stroke="#185FA5" stroke-width="1.6"/>

  <!-- Ink liquid: level drops, then refills, looping -->
  <g clip-path="url(#liquidClip)">
    <rect x="45" y="27" width="16" height="21" fill="#185FA5">
      <animate attributeName="y" values="27;40;27" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="21;8;21" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- tiny surface ripple -->
    <ellipse cx="53" cy="27" rx="7" ry="1" fill="#378ADD" opacity="0.7">
      <animate attributeName="cy" values="27;40;27" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
